{% extends "base.html" %}

{% block title %}Gestão de Documentos{% endblock %}

{% block content %}
<div id="react-root"></div>

<!-- Bibliotecas React e Babel -->
<script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
    /* Tema */
    .btn-brand-custom {
        background-color: var(--cor-primaria, #0a2240); 
        color: white;
        border: none;
        transition: 0.3s;
    }
    .btn-brand-custom:hover {
        background-color: var(--cor-primaria-hover, #153358);
        color: white;
        transform: translateY(-1px);
    }
    
    /* Autocomplete Styling */
    .ac-wrapper { position: relative; width: 100%; }
    .ac-list {
        position: absolute;
        top: 100%; left: 0; right: 0;
        z-index: 1000;
        background: white;
        border: 1px solid #dee2e6;
        border-top: none;
        max-height: 200px;
        overflow-y: auto;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        border-radius: 0 0 4px 4px;
    }
    .ac-item {
        padding: 8px 12px;
        cursor: pointer;
        border-bottom: 1px solid #f8f9fa;
        font-size: 0.95rem;
    }
    .ac-item:hover { background-color: #f1f3f5; color: var(--cor-primaria, #0a2240); }
    
    /* Tags Selecionadas */
    .tag-item {
        background-color: #e9ecef;
        color: #495057;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #ced4da;
        margin-right: 5px;
        margin-bottom: 5px;
        animation: fadeIn 0.2s;
    }
    .tag-remove { cursor: pointer; color: #dc3545; font-weight: bold; }
    .tag-remove:hover { color: #a71d2a; }

    /* Nav Tabs Custom */
    .nav-pills .nav-link.active {
        background-color: var(--cor-primaria, #0a2240) !important;
        color: white !important;
    }
    .nav-pills .nav-link { color: var(--cor-primaria, #0a2240); font-weight: 500; }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

{% raw %}
<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- COMPONENTE: AUTOCOMPLETE MULTI-SELECT ---
    const MultiSelectInput = ({ items, selectedIds, onAdd, onRemove, placeholder, labelKey = 'nome', subLabelKey = null }) => {
        const [query, setQuery] = useState("");
        const [suggestions, setSuggestions] = useState([]);
        const [showList, setShowList] = useState(false);
        const wrapperRef = useRef(null);

        useEffect(() => {
            if (query.length > 0) {
                const lowerQ = query.toLowerCase();
                const filtered = items.filter(item => 
                    !selectedIds.includes(item.id) && 
                    item[labelKey].toLowerCase().includes(lowerQ)
                );
                setSuggestions(filtered);
                setShowList(true);
            } else {
                setShowList(false);
            }
        }, [query, items, selectedIds]);

        // Click Outside Handler
        useEffect(() => {
            const handleClickOutside = (event) => {
                if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                    setShowList(false);
                }
            };
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
        }, []);

        const handleSelect = (item) => {
            onAdd(item.id);
            setQuery("");
            setShowList(false);
        };

        const selectedItems = items.filter(i => selectedIds.includes(i.id));

        return (
            <div>
                <div className="ac-wrapper" ref={wrapperRef}>
                    <input 
                        type="text" 
                        className="form-control" 
                        placeholder={placeholder}
                        value={query}
                        onChange={e => setQuery(e.target.value)}
                        onFocus={() => query.length > 0 && setShowList(true)}
                    />
                    {showList && (
                        <div className="ac-list">
                            {suggestions.length > 0 ? (
                                suggestions.map(item => (
                                    <div key={item.id} className="ac-item" onClick={() => handleSelect(item)}>
                                        <strong>{item[labelKey]}</strong>
                                        {subLabelKey && item[subLabelKey] && <small className="text-muted ms-2">({item[subLabelKey]})</small>}
                                    </div>
                                ))
                            ) : (
                                <div className="p-3 text-muted small">Sem resultados.</div>
                            )}
                        </div>
                    )}
                </div>
                <div className="mt-2">
                    {selectedItems.map(item => (
                        <span key={item.id} className="tag-item">
                            {item[labelKey]}
                            <span className="tag-remove" onClick={() => onRemove(item.id)}>&times;</span>
                        </span>
                    ))}
                </div>
            </div>
        );
    };

    // --- COMPONENTE: NOVA SOLICITAÇÃO ---
    const NovaSolicitacao = ({ initialData }) => {
        const [form, setForm] = useState({ titulo: '', descricao: '' });
        
        // Modos: 'individual' (Lista de pessoas) ou 'lote' (Setores/Cargos)
        const [mode, setMode] = useState('individual'); 
        
        const [selFuncs, setSelFuncs] = useState([]);   // IDs Pessoas
        const [selSetores, setSelSetores] = useState([]); // IDs Setores
        const [selCargos, setSelCargos] = useState([]);   // IDs Cargos
        const [selDocs, setSelDocs] = useState([]);       // IDs Docs
        const [selAprovs, setSelAprovs] = useState([]);   // IDs Aprovadores

        // Helpers genéricos de Estado
        const addId = (list, setList, id) => setList([...list, id]);
        const removeId = (list, setList, id) => setList(list.filter(x => x !== id));

        const handleSubmit = async () => {
            // Validações
            if (!form.titulo) return alert("Por favor, preencha o Título.");
            if (selDocs.length === 0) return alert("Selecione pelo menos um documento.");
            
            if (mode === 'individual' && selFuncs.length === 0) return alert("Selecione ao menos um funcionário.");
            if (mode === 'lote' && selSetores.length === 0 && selCargos.length === 0) return alert("No modo Lote, selecione Setores ou Cargos.");

            const payload = {
                titulo: form.titulo, descricao: form.descricao, mode: mode,
                documentos: selDocs, aprovadores: selAprovs,
                funcionarios: selFuncs, setores: selSetores, cargos: selCargos
            };

            const btn = document.getElementById('btn-submit');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Enviando...`;

            try {
                const res = await fetch('/documentos/criar-solicitacao', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.success) {
                    alert(data.message);
                    window.location.reload();
                } else {
                    alert("Erro: " + data.message);
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (err) {
                console.error(err);
                alert("Erro de conexão.");
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        };

        return (
            <div className="card shadow-sm border-0">
                <div className="card-body p-4">
                    <h5 className="mb-4 text-secondary border-bottom pb-2">Detalhes da Solicitação</h5>
                    
                    <div className="row g-3 mb-4">
                        <div className="col-md-8">
                            <label className="form-label fw-bold">Título</label>
                            <input type="text" className="form-control" placeholder="Ex: Atualização Cadastral - 2025" 
                                value={form.titulo} onChange={e => setForm({...form, titulo: e.target.value})} />
                        </div>
                        <div className="col-md-4">
                            <label className="form-label fw-bold">Solicitante</label>
                            <input type="text" className="form-control bg-light" value={initialData.usuario_atual.nome} disabled />
                        </div>
                        <div className="col-12">
                            <label className="form-label">Descrição / Instruções (Opcional)</label>
                            <textarea className="form-control" rows="2" placeholder="Instruções para os colaboradores..."
                                value={form.descricao} onChange={e => setForm({...form, descricao: e.target.value})}></textarea>
                        </div>
                    </div>

                    <h5 className="mb-3 text-secondary border-bottom pb-2">Destinatários</h5>
                    
                    <div className="bg-light p-3 rounded border mb-4">
                        <div className="d-flex gap-4 mb-3">
                            <div className="form-check">
                                <input className="form-check-input" type="radio" name="mode" id="modeInd" 
                                    checked={mode === 'individual'} onChange={() => setMode('individual')} />
                                <label className="form-check-label fw-bold" htmlFor="modeInd">Individual (Múltiplos)</label>
                            </div>
                            <div className="form-check">
                                <input className="form-check-input" type="radio" name="mode" id="modeLot" 
                                    checked={mode === 'lote'} onChange={() => setMode('lote')} />
                                <label className="form-check-label fw-bold" htmlFor="modeLot">Em Lote (Setor / Cargo)</label>
                            </div>
                        </div>

                        {mode === 'individual' ? (
                            <MultiSelectInput 
                                items={initialData.funcionarios} selectedIds={selFuncs}
                                onAdd={id => addId(selFuncs, setSelFuncs, id)} onRemove={id => removeId(selFuncs, setSelFuncs, id)}
                                placeholder="Digite o nome do colaborador..." subLabelKey="setor"
                            />
                        ) : (
                            <div className="row g-3">
                                <div className="col-md-6 border-end">
                                    <label className="form-label fw-bold text-success small">SETORES</label>
                                    <MultiSelectInput 
                                        items={initialData.setores} selectedIds={selSetores}
                                        onAdd={id => addId(selSetores, setSelSetores, id)} onRemove={id => removeId(selSetores, setSelSetores, id)}
                                        placeholder="Adicionar Setor..."
                                    />
                                </div>
                                <div className="col-md-6">
                                    <label className="form-label fw-bold text-info small">CARGOS</label>
                                    <MultiSelectInput 
                                        items={initialData.cargos} selectedIds={selCargos}
                                        onAdd={id => addId(selCargos, setSelCargos, id)} onRemove={id => removeId(selCargos, setSelCargos, id)}
                                        placeholder="Adicionar Cargo..."
                                    />
                                </div>
                                <div className="col-12 text-muted small fst-italic">
                                    <i className="bi bi-info-circle me-1"></i>
                                    Se selecionar Setor E Cargo, enviará apenas para quem tem aquele cargo naquele setor (Interseção).
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="row g-4">
                        <div className="col-md-6">
                            <h5 className="mb-3 text-secondary border-bottom pb-2">Documentos</h5>
                            <MultiSelectInput 
                                items={initialData.tipos_documento} selectedIds={selDocs}
                                onAdd={id => addId(selDocs, setSelDocs, id)} onRemove={id => removeId(selDocs, setSelDocs, id)}
                                placeholder="Selecione os tipos..."
                            />
                        </div>
                        <div className="col-md-6 border-start">
                            <h5 className="mb-3 text-secondary border-bottom pb-2">Workflow de Aprovação</h5>
                            <MultiSelectInput 
                                items={initialData.aprovadores} selectedIds={selAprovs}
                                onAdd={id => addId(selAprovs, setSelAprovs, id)} onRemove={id => removeId(selAprovs, setSelAprovs, id)}
                                placeholder="Adicionar Aprovador..."
                            />
                            <div className="form-text mt-1">
                                Se vazio, a aprovação será feita pelo fluxo padrão (Solicitante/RH).
                            </div>
                        </div>
                    </div>

                    <div className="d-flex justify-content-end mt-5 pt-3 border-top">
                        <button id="btn-submit" className="btn btn-brand-custom px-5 py-2 shadow-sm" onClick={handleSubmit}>
                            Enviar Solicitação <i className="bi bi-send-fill ms-2"></i>
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // --- COMPONENTE: REVISÃO UNIFICADA ---
    const RevisaoTab = ({ docs }) => {
        const handleAction = async (id, action) => {
            const motivo = action === 'rejeitar' ? prompt("Motivo da rejeição:") : null;
            if (action === 'rejeitar' && !motivo) return;

            try {
                const url = action === 'aprovar' ? `/api/aprovar-documento/${id}` : `/api/rejeitar-documento/${id}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ motivo })
                });
                const data = await res.json();
                alert(data.message);
                if(data.success) window.location.reload();
            } catch(e) { console.error(e); alert("Erro ao processar."); }
        };

        return (
            <div className="card shadow-sm border-0">
                <div className="card-body p-0">
                    <div className="table-responsive">
                        <table className="table table-hover align-middle mb-0">
                            <thead className="bg-light">
                                <tr>
                                    <th className="ps-4">Funcionário</th>
                                    <th>Documento</th>
                                    <th>Data Envio</th>
                                    <th className="text-end pe-4">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                {docs.length === 0 ? (
                                    <tr><td colSpan="4" className="text-center p-5 text-muted">Nenhum documento pendente para sua revisão.</td></tr>
                                ) : (
                                    docs.map(doc => (
                                        <tr key={doc.id}>
                                            <td className="ps-4">
                                                <div className="fw-bold">{doc.funcionario_nome}</div>
                                                <small className="text-muted">{doc.setor_nome}</small>
                                            </td>
                                            <td>
                                                <a href={doc.url_download} target="_blank" className="text-decoration-none">
                                                    <i className="bi bi-file-earmark-text me-1"></i> {doc.tipo}
                                                </a>
                                            </td>
                                            <td>{doc.data_envio}</td>
                                            <td className="text-end pe-4">
                                                <button className="btn btn-sm btn-outline-success me-2" title="Aprovar" onClick={() => handleAction(doc.id, 'aprovar')}>
                                                    <i className="bi bi-check-lg"></i>
                                                </button>
                                                <button className="btn btn-sm btn-outline-danger" title="Rejeitar" onClick={() => handleAction(doc.id, 'rejeitar')}>
                                                    <i className="bi bi-x-lg"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );
    };

    // --- APP PRINCIPAL ---
    const App = () => {
        const [tab, setTab] = useState('solicitar');
        const data = window.INITIAL_DATA || { funcionarios: [], setores: [], cargos: [], documentos_revisao: [], tipos_documento: [], aprovadores: [] };

        return (
            <div>
                <div className="d-flex justify-content-between align-items-center mb-4">
                    <h2 className="h4 text-dark mb-0 border-start border-4 border-primary ps-3">Gestão de Documentos</h2>
                    
                    <ul className="nav nav-pills bg-white p-1 rounded shadow-sm">
                        <li className="nav-item">
                            <button className={`nav-link px-4 ${tab === 'solicitar' ? 'active' : ''}`} onClick={() => setTab('solicitar')}>
                                <i className="bi bi-plus-circle me-2"></i> Solicitar
                            </button>
                        </li>
                        <li className="nav-item">
                            <button className={`nav-link px-4 ${tab === 'revisao' ? 'active' : ''}`} onClick={() => setTab('revisao')}>
                                <i className="bi bi-list-check me-2"></i> Revisão
                                {data.documentos_revisao.length > 0 && <span className="badge bg-danger ms-2">{data.documentos_revisao.length}</span>}
                            </button>
                        </li>
                    </ul>
                </div>

                {tab === 'solicitar' && <NovaSolicitacao initialData={data} />}
                {tab === 'revisao' && <RevisaoTab docs={data.documentos_revisao} />}
            </div>
        );
    };

    ReactDOM.render(<App />, document.getElementById('react-root'));
</script>
{% endraw %}

<!-- INJEÇÃO DE DADOS (Fora do raw para o Jinja funcionar) -->
<script>
    window.INITIAL_DATA = {{ initial_data | tojson }};
</script>

{% endblock %}
