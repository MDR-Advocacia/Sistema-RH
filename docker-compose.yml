services:
  # --- APLICAÇÃO WEB (MDRH) ---
  web:
    build: .
    container_name: mdrh_app
    restart: always
    ports:
      # MUDANÇA: Mapeamos a porta 5001 do Mac para a 5000 do Container
      # Acesse via http://localhost:5001
      - "5001:5000"
    volumes:
      # Mapeia o código para facilitar debug se precisar (opcional em produção)
      - .:/app
      # Persiste uploads fora do container
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      # Sobrescreve a URL do banco para usar o host 'db' interno do Docker
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - FLASK_APP=run.py
      # Gunicorn roda melhor sem reload em 'prod', mas em teste ok
      - FLASK_DEBUG=0 
    # AQUI: Adicionamos --timeout 120 para evitar que o login lento do AD mate o worker
    command: ["gunicorn", "-w", "4", "-b", "0.0.0.0:5000", "--timeout", "120", "run:app"]
    depends_on:
      - db
    networks:
      - mdrh_net

  # --- BANCO DE DADOS ---
  db:
    image: postgres:16
    container_name: mdrh_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      # Garante que o PG use as mesmas credenciais do .env
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - mdrh_net

  # --- SERVIÇO DE BACKUP (Agendado) ---
  backup:
    image: postgres:16
    container_name: mdrh_backup
    volumes:
      - ./scripts:/scripts
      - ./backups:/backups
    env_file:
      - .env
    environment:
      - PGHOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - db
    # Script que roda o pg_dump periodicamente
    command: ["/bin/bash", "/scripts/backup.sh"] 
    networks:
      - mdrh_net

  # --- SERVIÇO DE RESTAURAÇÃO (Manual) ---
  restore:
    image: postgres:16
    container_name: mdrh_restore
    volumes:
      - ./backups:/backups
    env_file:
      - .env
    environment:
      - PGHOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - db
    networks:
      - mdrh_net
    # Entrypoint configurado para receber o arquivo como argumento
    # Usa --clean para limpar o banco antes de restaurar e --if-exists para evitar erro se não existir
    entrypoint: ["pg_restore", "-h", "db", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "--clean", "--if-exists", "--no-owner", "--role=${POSTGRES_USER}"]

volumes:
  postgres_data:

networks:
  mdrh_net: